<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <p id="status" role="status" aria-live="polite">채팅에 연결하는 중입니다...</p>
  <div id="webchat" style="height: 600px"></div>
  <script src="https://cdn.botframework.com/botframework-webchat/4.18.0/webchat.js"></script>
  <script>
    const BROKER_URL = "https://dl-broker-juwon-4jt3z.azurewebsites.net/api/directlineToken";
    const SEALED = "j43dEceJluFPLk3bqZm5L5MdD2yx5AXTo4ECGWHXAe4j5Aw65zSrLF1d4PW1NWUoXbQyBAwFrNWtFjolGo_5bOGAPd1ofZY9rZq8pxTUqPBlQlry-TROBVCRAuyMY3nSm2V6ynz8U2F6lTD3ufI6UxPembv0Q-KJ1gYLSkbtiL_KrLmrtDFQ6YQFQ7HCWnkS0CdTJ7Jeig7qg7Odfo9av_snAxY2IifB8ihpmsoM9pLcAtYOVs387Ks0tHX6bflug2WDSgbJhL5_CRttrj_iIl_Re1OxCqCRz6Hs9Q9XyO5xTHTLXTV2i0ilQGZ-EnSCIThf2NDNOU9MgoJPH8DQloxkUAmcWSnHaao5e5v25oaIJBvKPZff7xpfVtFY9qrIGAPeyRowjv8sHiekY5gSOAYM55b97wIgXOUBV_x1N1kU3i6Xi_Fg6aveMvzNBl-Y-7-E0vo9IstkLim7Kki7HsZcv5YNzILkIPUyY0I6oloo5Q3OE4XUhKiBCAcsrUkDg7I9fKPQIARzv8KGLnQzGJ1SNxtZLfbK2gDhWRUwb4HYYLpudTLqLBvJsRASXXbzj7jUfplKZPTmmOOpay_u9XAAp8uAJEqVvAUBzFWaupGrd6XEOmRbtzkROau-geu1H6aEiejQ1zl6RAFmSA";
    const status = document.getElementById("status");

    function showError(message) {
      status.hidden = false;
      status.textContent = message;
    }

    async function connect() {
      if (!window.WebChat ||
          typeof WebChat.createDirectLine !== "function" ||
          typeof WebChat.renderWebChat !== "function") {
        showError("채팅 구성 요소를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.");
        return;
      }

      let response;
      try {
        // Keep this a simple CORS request; the broker may not support preflight.
        response = await fetch(BROKER_URL, {
          method: "POST",
          body: JSON.stringify({ sealed: SEALED })
        });
      } catch {
        showError("서버에 연결하지 못했습니다. 네트워크와 배포 주소를 확인해 주세요.");
        return;
      }
      if (!response.ok) {
        showError("서버가 연결 요청을 처리하지 못했습니다 (HTTP " + response.status + ").");
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch {
        showError("서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      if (!data || typeof data.token !== "string" || !data.token.trim()) {
        showError("서버에서 연결 토큰을 받지 못했습니다. 암호와 배포 주소를 확인해 주세요.");
        return;
      }

      try {
        const directLine = WebChat.createDirectLine({ token: data.token });
        status.hidden = true;
        directLine.postActivity({
          type: "event", name: "startConversation", from: { id: "user" }
        }).subscribe({
          error: () => showError("첫 인사를 요청하지 못했습니다. 채팅창에 메시지를 입력해 주세요.")
        });
        WebChat.renderWebChat({ directLine, locale: "ko-KR" }, document.getElementById("webchat"));
      } catch {
        showError("채팅을 시작하지 못했습니다. 새로고침 후 다시 시도해 주세요.");
      }
    }

    connect();
  </script>
</body>
</html>
